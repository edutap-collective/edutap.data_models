[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.data_models"
# 0.2.2 rather than releasing 0.2.1 to PyPI, and the reason is the tag. `v0.2.1`
# points at the commit that added the mTLS transport, which is *before* the release
# workflow existed -- a GitHub Release on it would fire the event and find no workflow
# at that ref. Moving the tag was the alternative and is worse: consumers already
# fetch `@v0.2.1` as a git reference, and a tag that changes under them is the kind of
# thing nobody reconstructs later. So the first PyPI release gets its own number, and
# from here one version means one tag means one commit.
version = "0.3.0"
description = "Shared vocabularies, message contract, Kafka runtime and settings building blocks for eduTAP"
readme = "README.md"
requires-python = ">=3.13"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
# No `License ::` classifier: `license` above is a PEP 639 SPDX expression, and the
# two together are rejected by the build backend rather than merely redundant.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Three dependencies, and the third had to be argued for. This package is imported
# by every other eduTAP package; anything it pulls in, they all pull in. The rule to
# keep: if a dependency would only serve one consumer, it belongs in that consumer.
# Notably still absent is the Kafka driver -- the runtime loop is written against
# protocols, so `aiokafka` stays with the services that build consumers and
# producers.
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # The third, with the reason the guard rail asks for: the runtime loop's log
    # records are structured -- topic, partition, offset, reason -- and that
    # structure is their entire value in operation. Routed through stdlib logging it
    # would collapse into a message string. Every consumer already uses it.
    "structlog>=25",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    # Test-only, not a runtime dependency: the runtime loop is written against plain
    # asyncio, and anyio is here for its pytest plugin so the async tests can run.
    "anyio>=4.4",
    # Test-only for the same reason. The transport tests need a real certificate,
    # key and CA, and generating them per run beats committing fixture files that
    # expire -- a suite that goes red one morning for a reason unrelated to the
    # change that triggered it teaches people to ignore it. Nothing at runtime
    # imports this: `transport_options` builds its context from stdlib `ssl`.
    "cryptography>=44",
    "ruff>=0.16,<0.17",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.data_models"
Issues = "https://github.com/edutap-collective/edutap.data_models/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# `tests/**` rather than `tests/*`: a single star does not cross a directory
# separator, so the subdirectories under tests/ were not covered.
"tests/**" = ["D", "S101"]
# S105/S106: the transport tests need a key password in the clear -- it belongs to a
# throwaway key generated in a tmp_path and thrown away with it. Scoped to these two
# files rather than added to `tests/**` so a real credential pasted into any other
# test still gets caught.
"tests/runtime/conftest.py" = ["S105"]
"tests/runtime/test_transport.py" = ["S106"]
# S105: bandit's hardcoded-password heuristic fires on TOPIC_PASS_COMMAND,
# TOPIC_PASS_STATE and TOPIC_PASS_LOG because their names contain "PASS". They are
# wallet-pass topics, not passwords. Scoped to this one file so the check still
# applies everywhere else.
"src/edutap/data_models/messaging.py" = ["S105"]
# The same false positive, two more places. `EUDI_PASS` is a wallet type and
# `pass_id`/`pass_template` are pass identifiers; none of them is a credential.
#
# `vocabulary.py` was already failing on `main` when this was added -- the entry that
# introduced `EUDI_PASS` went in without the check being run. Fixed here rather than
# left, because a red baseline makes every later run useless: nobody reads the output
# of a check that is always red.
"src/edutap/data_models/vocabulary.py" = ["S105"]
"tests/test_messaging.py" = ["S105", "S106"]
